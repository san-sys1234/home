<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Unser Zuhause">
<link rel="manifest" href="manifest.webmanifest">
<title>Unser Zuhause</title>
<style>
:root{--bg:#f7f3ed;--card:#fffdf9;--ink:#342f2a;--muted:#82786e;--line:#e8dfd5;--green:#78966e;--rose:#c98d8d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
header{padding:22px 18px 12px;position:sticky;top:0;background:rgba(247,243,237,.96);backdrop-filter:blur(12px);z-index:5}
h1{font-size:27px;margin:0 0 3px}.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:7px;padding:7px 12px 12px;position:sticky;top:73px;background:rgba(247,243,237,.96);z-index:4}
nav button{flex:1;border:0;background:#eee7df;border-radius:14px;padding:10px 4px;color:#665b51;font-weight:650}
nav button.active{background:var(--ink);color:white}
main{padding:0 14px 90px;max-width:720px;margin:auto}.hint{background:#f0e8df;border-radius:16px;padding:12px 14px;color:#675c53;font-size:13px;margin:10px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px;background:var(--card);border:1px solid var(--line);border-radius:18px}.num{font-size:25px;font-weight:750}.label{font-size:12px;color:var(--muted)}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.sectionhead h2{margin:0}h2{font-size:20px;margin:22px 0 10px}
.smallbtn{border:0;background:#ebe2d9;color:#62574d;border-radius:12px;padding:8px 10px;font-weight:600}
.progress{height:8px;background:#e6ddd4;border-radius:8px;overflow:hidden;margin:10px 0 14px}.progress i{display:block;height:100%;background:var(--green);width:0}
.room{background:var(--card);border:1px solid var(--line);border-radius:20px;margin:12px 0;overflow:hidden}
.roomhead{display:flex;justify-content:space-between;align-items:center;padding:15px 16px 11px;background:#faf6f0}.roomtitle{font-size:18px;font-weight:750}.count{font-size:12px;background:#e8e0d7;padding:6px 9px;border-radius:11px;color:#62574d}
.task{position:relative;overflow:hidden;border-top:1px solid var(--line);touch-action:pan-y}.under{position:absolute;inset:0;display:flex;align-items:center;padding:0 20px;color:white;font-weight:800;opacity:0}.under.right{background:var(--green)}.under.left{background:var(--rose);justify-content:flex-end}
.body{position:relative;background:var(--card);display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:60px;transition:transform .12s ease}.dot{width:14px;height:14px;border:2px solid #cfc4b8;border-radius:50%;flex:none}.title{font-size:15px}.done .dot{background:var(--green);border-color:var(--green)}.done .title{text-decoration:line-through;opacity:.6}.task.done{opacity:.65}
.badge{margin-left:auto;font-size:11px;padding:5px 7px;border-radius:9px;background:#eee7df;color:#695d52;white-space:nowrap}
.day{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0}.day strong{font-size:16px}.day ul{margin:8px 0 0;padding-left:18px;color:#665c54;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:35px 10px}
footer{position:fixed;bottom:0;left:0;right:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:rgba(247,243,237,.96);z-index:6}footer button{width:100%;padding:13px;border:0;border-radius:15px;background:var(--ink);color:#fff;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(35,28,23,.35);display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:var(--card);width:100%;border-radius:25px 25px 0 0;padding:20px;max-height:75vh;overflow:auto}.close{float:right;border:0;background:#eee7df;border-radius:50%;width:32px;height:32px}
@media(min-width:700px){footer{position:static;background:none;padding:15px 0}footer button{width:auto}}
</style>
</head>
<body>
<header><h1>Unser Zuhause 🏡</h1><div class="sub" id="date"></div></header>
<nav><button class="active" data-tab="today">Heute</button><button data-tab="week">Woche</button><button data-tab="rotation">Rotation</button></nav>
<main><section id="today"></section><section id="week" hidden></section><section id="rotation" hidden></section></main>
<footer><button id="chaos">🧸 Hanni-Chaosmodus</button></footer>
<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">×</button><div id="modalText"></div></div></div>
<script>
const KEY="unserZuhauseV12";
const state=JSON.parse(localStorage.getItem(KEY)||'{"done":{},"skipped":{},"lastDone":{},"chaos":false,"rotationStart":null}');
const today=()=>new Date().toISOString().slice(0,10);
if(!state.rotationStart) state.rotationStart=today();
const germanDate=()=>new Date().toLocaleDateString("de-AT",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
const dayNumber=()=>{const n=new Date().getDay();return n===0?7:n};
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};
const idFor=(room,index)=>today()+"|"+room+"|"+index;
const done=id=>!!state.done[id], skipped=id=>!!state.skipped[id];
const finish=id=>{state.done[id]=true;delete state.skipped[id];save()};
const later=id=>{state.skipped[id]=true;save()};
const roomsByDay={
  1:[
    ["Wohnzimmer",["Herumliegende Dinge grob wegräumen","Sichtbare Flächen abstauben","Sofakissen richten","Boden bei Bedarf saugen"]],
    ["Essbereich",["Esstisch abwischen","Stühle kurz abwischen","Sichtbare Krümel entfernen","Boden bei Bedarf saugen"]],
    ["Küche",["Arbeitsflächen wischen","Herd wischen","Spüle und Armatur wischen","Fronten bei sichtbaren Flecken wischen","Boden bei Bedarf saugen"]]
  ],
  2:[
    ["Gäste-WC · EG",["Waschbecken reinigen","Armatur reinigen","Toilette reinigen","Spiegel reinigen","Boden reinigen"]],
    ["Kinderbad · OG",["Waschbecken reinigen","Armatur reinigen","Badewanne/Dusche reinigen","Spiegel reinigen","Toilette reinigen","Boden reinigen"]],
    ["Bad · OG",["Waschbecken reinigen","Armaturen reinigen","Dusche/Badewanne reinigen","Spiegel reinigen","Toilette reinigen","Boden reinigen"]],
    ["WC · OG",["Waschbecken reinigen","Armatur reinigen","Toilette reinigen","Spiegel reinigen","Boden reinigen"]]
  ],
  3:[
    ["Schlafzimmer · OG",["Bett machen","Kleidung wegräumen","Nachttische ordnen","Sichtbare Flächen abstauben","Boden saugen"]],
    ["Ankleidezimmer · OG",["Kleidung ordentlich einräumen","Herumliegende Dinge wegräumen","Ablagen ordnen","Sichtbare Flächen abstauben","Boden saugen"]],
    ["Kinderzimmer 1 · OG",["Herumliegende Dinge grob ordnen","Sichtbare Flächen abstauben","Boden saugen"]],
    ["Kinderzimmer 2 · OG",["Herumliegende Dinge grob ordnen","Sichtbare Flächen abstauben","Boden saugen"]]
  ],
  4:[
    ["Eingangsbereich · EG",["Herumliegende Dinge wegräumen","Ablageflächen aufräumen","Ablageflächen abwischen","Spiegel reinigen","Boden bei Bedarf saugen"]],
    ["Garderobe · EG",["Schuhe ordentlich stellen","Jacken und Taschen ordnen","Garderobenbank / Ablage aufräumen","Garderobenflächen abwischen","Spiegel reinigen"]],
    ["Flur · EG",["Herumliegende Dinge wegräumen","Sichtbare Flächen abstauben","Boden saugen"]],
    ["Büro · EG",["Schreibtisch aufräumen","Arbeitsflächen abwischen","Sichtbare Flächen abstauben","Papier und herumliegende Dinge ordnen","Boden saugen"]],
    ["Abstellraum · EG",["Dinge an ihren Platz stellen","Ablageflächen ordnen","Sichtbaren Staub entfernen","Boden bei Bedarf reinigen"]],
    ["Speis · EG",["Lebensmittel auf Ablauf prüfen","Vorräte ordentlich stellen","Ablageflächen abwischen","Krümel und sichtbaren Schmutz entfernen","Boden bei Bedarf saugen"]]
  ],
  5:[
    ["Waschküche · Keller",["Waschmaschine außen abwischen","Trockner außen abwischen","Arbeitsfläche abwischen","Wäsche ordnen","Boden bei sichtbarem Schmutz reinigen"]],
    ["Musikzimmer · Keller",["Herumliegende Dinge grob ordnen","Sichtbare Flächen abstauben","Offensichtlichen Schmutz entfernen"]],
    ["Trainingsraum · Keller",["Sachen zurücklegen","Trainingsflächen bei Bedarf wischen","Sichtbaren Schmutz entfernen"]]
  ],
  6:[
    ["Waschküche · Keller",["Wäsche nur bei Bedarf waschen","Wäsche zusammenlegen","Wäsche wegräumen"]],
    ["Kleine Extra-Aufgabe",["Genau eine kleine Zusatzaufgabe auswählen"]]
  ],
  7:[]
};
const daily=[
 ["Morgenroutine · Alltag",["Bett machen","Schlafzimmer lüften","Kleidung wegräumen","Wäschekorb prüfen","Vorhänge / Raffstores öffnen","Spülmaschine ausräumen","Frühstücksgeschirr einräumen","Arbeitsflächen wischen","Esstisch wischen","Hochstuhl / Essbereich reinigen","Garderobe grob ordnen"]],
 ["Nach den Mahlzeiten · EG",["Geschirr in die Spülmaschine räumen","Esstisch wischen","Hochstuhl / Essbereich reinigen","Heruntergefallenes Essen vom Boden entfernen","Arbeitsfläche bei Bedarf wischen"]],
 ["Abendlicher 10-Minuten-Reset · Alltag",["Spülmaschine beladen und starten","Arbeitsflächen wischen","Herd wischen","Spüle und Armatur wischen","Esstisch wischen","Hanni-Essbereich reinigen","Müll prüfen","Wohnzimmer grob zurücksetzen","Garderobe grob ordnen","Kleidung wegräumen"]],
 ["Tagescheck · Alltag",["Restmüll / Biomüll prüfen","Wäsche nur bei Bedarf","Toiletten nur bei Bedarf prüfen","Küchenboden bei Essensresten reinigen","Sichtbare Flecken entfernen"]]
];
const rotations=[
 ["Türklinken",7,"gesamtes Haus"],["Türrahmen / Zargen",30,"gesamtes Haus"],["Türblätter",75,"gesamtes Haus"],
 ["Sockelleisten",42,"gesamtes Haus"],["Decken-/Wandecken & Spinnweben",30,"gesamtes Haus"],["Lichtschalter",30,"gesamtes Haus"],
 ["Steckdosen außen",75,"gesamtes Haus"],["Stuck",120,"gesamtes Haus"],["Fenster – Teilabschnitt",180,"gesamtes Haus"],
 ["Raffstores",180,"gesamtes Haus"],["Vorhänge & Schienen",180,"gesamtes Haus"],["Kühlschrank",30,"Küche · EG"],
 ["Backofen",75,"Küche · EG"],["Spülmaschine – Pflege",30,"Küche · EG"],["Waschmaschine – Pflege",30,"Waschküche · Keller"],
 ["Saunaraum – Monatscheck",30,"Saunaraum · OG"],["Matratzen – Pflege",180,"Schlafzimmer / Kinderzimmer · OG"],
 ["Fugen & Silikon – Kontrolle",90,"Bäder & WCs"],["Erreichbare Lampen",120,"gesamtes Haus"]
];
function taskCard(t){
 const isDone=done(t.id);
 return `<div class="task ${isDone?"done":""}" data-id="${t.id}">
  <div class="under right">ERLEDIGT ✓</div><div class="under left">SPÄTER</div>
  <div class="body"><span class="dot"></span><div style="flex:1"><div class="title">${t.title}</div><div class="sub">${t.dur} Min</div></div><span class="badge">${isDone?"✓":"wischen"}</span></div>
 </div>`;
}
function roomCard(room, actions){
 const visible=actions.map((a,i)=>({id:idFor(room,i),title:a,dur:Math.max(1,Math.round(10/actions.length))})).filter(t=>!skipped(t.id));
 if(!visible.length)return "";
 const n=visible.filter(t=>done(t.id)).length;
 return `<div class="room"><div class="roomhead"><div class="roomtitle">${room}</div><div class="count">${n}/${visible.length}</div></div>${visible.map(taskCard).join("")}</div>`;
}
function renderToday(){
 const d=dayNumber(), special=roomsByDay[d]||[];
 let items=[];
 daily.forEach((g,ri)=>g[1].forEach((a,i)=>items.push({id:idFor("daily"+ri,i),title:a,dur:1})));
 special.forEach((g,ri)=>g[1].forEach((a,i)=>items.push({id:idFor(g[0],i),title:a,dur:1})));
 const n=items.filter(x=>done(x.id)).length,total=items.length;
 let out=`<div class="hint">👉 <b>Rechts wischen = erledigt.</b> 👈 <b>Links = später.</b> Jede konkrete Tätigkeit ist einzeln gespeichert. Nichts wird automatisch auf morgen nachgeholt.</div>`;
 if(d===4)out+=`<div class="hint"><b>Donnerstag · EG</b><br>Eingangsbereich, Garderobe, Flur, Büro, Abstellraum und Speis. Keine Spezial-Rotation heute.</div>`;
 out+=`<div class="grid"><div class="stat"><div class="num">${n}/${total}</div><div class="label">Einzel-To-dos erledigt</div></div><div class="stat"><div class="num">${total}</div><div class="label">Einzel-To-dos heute</div></div></div>`;
 out+=`<div class="sectionhead"><h2>Heute</h2><button class="smallbtn" id="reset">Zurücksetzen</button></div><div class="progress"><i style="width:${total?n/total*100:0}%"></i></div>`;
 out+=`<h2>Alltag</h2>`;
 daily.forEach((g,ri)=>{out+=roomCard(g[0],g[1].map((a,i)=>({id:idFor("daily"+ri,i),title:a,dur:1})).filter(x=>!skipped(x.id)).map(x=>x.title))});
 // roomCard generates IDs by room, so daily IDs above are not used there; use dedicated function for exact IDs below.
 out=out.replace(/<h2>Alltag<\/h2>[\s\S]*?<h2>/,`<h2>Alltag</h2>${daily.map((g,ri)=>roomCard(g[0],g[1])).join("")}<h2>`);
 if(special.length)out+=special.map(g=>roomCard(g[0],g[1])).join("");
 out+=`<h2>🧸 Haus darf heute auch Haus sein</h2><div class="hint">Bei Hanni-Chaos reichen Essen, Geschirr, Müll, sichere Wege und offensichtlicher Schmutz. Spielzeug muss nicht ständig weggeräumt werden.</div>`;
 document.getElementById("today").innerHTML=out;bindSwipes();
}
function renderWeek(){
 const names=["","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
 let out="<h2>Diese Woche</h2><div class='hint'>Die Wochentage sind Anker, keine Pflicht. Ausgefallene Tage stapeln sich nicht.</div>";
 for(let d=1;d<=7;d++){if(d===7)out+=`<div class="day"><strong>Sonntag 🌿</strong><div class="sub">Haushaltsfrei – nur Alltag & Notwendiges.</div></div>`;
 else out+=`<div class="day"><strong>${names[d]}</strong><ul>${(roomsByDay[d]||[]).map(x=>"<li>"+x[0]+"</li>").join("")||"<li>nur Alltag</li>"}</ul></div>`}
 document.getElementById("week").innerHTML=out;
}
function daysSince(s){if(!s)return 9999;return Math.floor((new Date(today())-new Date(s))/86400000)}
function renderRotation(){
 let out="<h2>Hauspflege-Rotation</h2><div class='hint'>Die Rotation wird separat geführt und drängt sich nicht in deinen Tagesplan. Maßgeblich ist das echte Erledigungsdatum.</div>";
 rotations.forEach((r,i)=>{const last=state.lastDone["rot"+i];const left=last?Math.max(0,r[1]-daysSince(last)):r[1];out+=`<div class="day"><strong>${r[0]}</strong><div class="sub">📍 ${r[2]} · ${last?left===0?"jetzt fällig":"in "+left+" Tagen":"noch nicht erledigt"}</div></div>`});
 document.getElementById("rotation").innerHTML=out;
}
function bindSwipes(){
 document.querySelectorAll(".task").forEach(el=>{
  let sx=0,dx=0;
  el.addEventListener("pointerdown",e=>{sx=e.clientX;dx=0;el.setPointerCapture(e.pointerId)});
  el.addEventListener("pointermove",e=>{dx=e.clientX-sx;const b=el.querySelector(".body"),r=el.querySelector(".right"),l=el.querySelector(".left");if(Math.abs(dx)>8){b.style.transform=`translateX(${dx}px)`;const a=Math.min(Math.abs(dx)/100,1);if(dx>0){r.style.opacity=a;l.style.opacity=0}else{l.style.opacity=a;r.style.opacity=0}}});
  el.addEventListener("pointerup",()=>{if(Math.abs(dx)>85){dx>0?finish(el.dataset.id):later(el.dataset.id)}else{el.querySelector(".body").style.transform="";el.querySelector(".right").style.opacity=0;el.querySelector(".left").style.opacity=0}});
  el.addEventListener("pointercancel",()=>{el.querySelector(".body").style.transform=""});
 });
}
function render(){document.getElementById("date").textContent=germanDate();renderToday();renderWeek();renderRotation();document.getElementById("chaos").textContent=state.chaos?"🧸 Chaosmodus AUS":"🧸 Hanni-Chaosmodus"}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");["today","week","rotation"].forEach(id=>document.getElementById(id).hidden=id!==b.dataset.tab)});
document.getElementById("chaos").onclick=()=>{state.chaos=!state.chaos;save()};
document.getElementById("reset").onclick=()=>{Object.keys(state.done).filter(k=>k.startsWith(today()+"|")).forEach(k=>delete state.done[k]);Object.keys(state.skipped).filter(k=>k.startsWith(today()+"|")).forEach(k=>delete state.skipped[k]);save()};
render();
</script>
</body>
</html>
