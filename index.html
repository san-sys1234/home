<body>
<header><h1>Unser Zuhause 🏡</h1><div class="sub" id="date"></div></header>
<nav><button class="active" data-tab="today">Heute</button><button data-tab="week">Woche</button><button data-tab="calendar">📅 Verlauf</button><button data-tab="chat">🤖 Chat</button></nav>
<main><section id="today"></section><section id="week" hidden></section><section id="calendar" hidden></section><section id="chat" hidden></section></main>
<div class="footer"><button id="chaos">🧸 Hanni-Chaosmodus</button></div>
<script>
(function(){
'use strict';
const KEY='unserZuhauseV14';
const initial={done:{},skipped:{},lastDone:{},extras:{},chaos:false,rotationStart:null};
let state;
let calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);
let calendarSelected=today();
try{state=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(initial))}catch(e){state=JSON.parse(JSON.stringify(initial))}
if(!state.done||typeof state.done!=='object')state.done={};
if(!state.skipped||typeof state.skipped!=='object')state.skipped={};
if(!state.lastDone||typeof state.lastDone!=='object')state.lastDone={};
if(!state.extras||typeof state.extras!=='object')state.extras={};
if(!Array.isArray(state.customTasks))state.customTasks=[];
if(typeof state.chaos!=='boolean')state.chaos=false;

function localDate(d){d=d||new Date();const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function parseDate(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function today(){return localDate()}
function dayNumber(){const n=new Date().getDay();return n===0?7:n}
function germanDate(){return new Intl.DateTimeFormat('de-AT',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date())}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function canonicalId(scope,index){return scope+'|'+index}
function dayTaskId(scope,index){return today()+'|'+canonicalId(scope,index)}
function isDone(id){return state.done[id]===true}
function isSkipped(id){return state.skipped[id]===true}
function lastFor(id){return state.lastDone[id]||null}
function markDone(id,rotationIndex,canonical){state.done[id]=true;delete state.skipped[id];state.lastDone[canonical||id]=today();if(rotationIndex!==undefined)state.lastDone['rot'+rotationIndex]=today();save()}
function skip(id){state.skipped[id]=true;delete state.done[id];save()}
function daysSince(s){if(!s)return 9999;return Math.max(0,Math.floor((parseDate(today())-parseDate(s))/86400000))}
function dueByInterval(id,interval){const last=lastFor(id);return !last||daysSince(last)>=interval}
function rememberExtra(id){const d=today();if(!state.extras[d])state.extras[d]=[];if(!state.extras[d].includes(id))state.extras[d].push(id);}
function addCustomTask(title,room,interval,category='Eigene Aufgabe'){
 const id='custom|'+Date.now().toString(36)+'|'+Math.random().toString(36).slice(2,7);
 const t={id,scope:'custom',room:room||'Eigenes Zuhause',title:title.trim(),interval:Number(interval)||0,category};
 state.customTasks.push(t);taskLibrary.push(t);return t;
}

const roomsByDay={
1:[

],

 ['Kinderbad · OG',['Waschbecken reinigen','Armatur reinigen','Badewanne/Dusche reinigen','Spiegel reinigen','Toilette reinigen','Boden reinigen']],
 ['Bad · OG',['Waschbecken reinigen','Armaturen reinigen','Dusche/Badewanne reinigen','Spiegel reinigen','Toilette reinigen','Boden reinigen']],

],

],

 ['Flur · EG',['Herumliegende Dinge wegräumen','Sichtbare Flächen abstauben','Boden saugen']],
 ['Büro · EG',['Schreibtisch aufräumen','Arbeitsflächen abwischen','Sichtbare Flächen abstauben','Papier und herumliegende Dinge ordnen','Boden saugen']],
 ['Abstellraum · EG',['Dinge an ihren Platz stellen','Ablageflächen ordnen','Sichtbaren Staub entfernen','Boden bei Bedarf reinigen']],
 ['Speis · EG',['Lebensmittel auf Ablauf prüfen','Vorräte ordentlich stellen','Ablageflächen abwischen','Krümel und sichtbaren Schmutz entfernen','Boden bei Bedarf saugen']]
],
5:[
 ['Waschküche · Keller',['Waschmaschine außen abwischen','Trockner außen abwischen','Arbeitsfläche abwischen','Wäsche ordnen','Boden bei sichtbarem Schmutz reinigen']],
 ['Musikzimmer · Keller',['Herumliegende Dinge grob ordnen','Sichtbare Flächen abstauben','Offensichtlichen Schmutz entfernen']],
 ['Trainingsraum · Keller',['Sachen zurücklegen','Trainingsflächen bei Bedarf wischen','Sichtbaren Schmutz entfernen']]
],

],

};

const daily=[
 ['Morgenroutine · Alltag',['Bett machen','Schlafzimmer lüften','Kleidung wegräumen','Wäschekorb prüfen','Vorhänge / Raffstores öffnen','Spülmaschine ausräumen','Frühstücksgeschirr einräumen','Arbeitsflächen wischen','Esstisch wischen','Hochstuhl / Essbereich reinigen','Garderobe grob ordnen']],
 ['Nach den Mahlzeiten · Alltag',['Geschirr in die Spülmaschine räumen','Esstisch wischen','Hochstuhl / Essbereich reinigen','Heruntergefallenes Essen vom Boden entfernen','Arbeitsfläche bei Bedarf wischen']],
 ['Abendlicher 10-Minuten-Reset · Alltag',['Spülmaschine beladen und starten','Arbeitsflächen wischen','Herd wischen','Spüle und Armatur wischen','Esstisch wischen','Hanni-Essbereich reinigen','Müll prüfen','Wohnzimmer grob zurücksetzen','Garderobe grob ordnen','Kleidung wegräumen']],
 ['Tagescheck · Alltag',['Restmüll / Biomüll prüfen','Wäsche nur bei Bedarf','Toiletten nur bei Bedarf prüfen','Küchenboden bei Essensresten reinigen','Sichtbare Flecken entfernen']]
];

];
const saturdayExtra=[
 ['Kleine Extra-Aufgabe · flexibel',['Eine kleine Schublade oder Ablage ordnen','Eine Ecke entstauben','Eine einzelne Tür / Fläche reinigen','Eine kleine Ablage aussortieren']]
];
const rotations=[
 ['Türklinken',7,'gesamtes Haus'],['Türrahmen / Zargen',30,'gesamtes Haus'],['Türblätter',75,'gesamtes Haus'],['Sockelleisten',42,'gesamtes Haus'],['Decken-/Wandecken & Spinnweben',30,'gesamtes Haus'],['Lichtschalter',30,'gesamtes Haus'],['Steckdosen außen',75,'gesamtes Haus'],['Stuck',120,'gesamtes Haus'],['Fenster EG – Abschnitt 1',180,'EG · Fenster'],['Fenster EG – Abschnitt 2',180,'EG · Fenster'],['Fenster OG – Abschnitt 1',180,'OG · Fenster'],['Fenster OG – Abschnitt 2',180,'OG · Fenster'],['Raffstores',180,'gesamtes Haus'],['Vorhänge & Schienen',180,'gesamtes Haus'],['Kühlschrank',30,'Küche · EG'],['Backofen',75,'Küche · EG'],['Spülmaschine – Pflege',30,'Küche · EG'],['Waschmaschine – Pflege',30,'Waschküche · Keller'],['Saunaraum – Monatscheck',30,'Saunaraum · OG'],['Matratzen – Pflege',180,'Schlafzimmer / Kinderzimmer · OG'],['Fugen & Silikon – Kontrolle',90,'Bäder & WCs'],['Erreichbare Lampen',120,'gesamtes Haus']
];

// Zentrale Aufgabenbibliothek: jede Aufgabe hat ihren eigenen Verlauf und Rhythmus.
const taskLibrary=[];
function addLibrary(scope,room,title,interval,category='Hauspflege'){
  const id=canonicalId(scope,arguments.length>5?arguments[5]:taskLibrary.length);
  taskLibrary.push({id,scope,room,title,interval,category});
  return id;
}

// Tages-/Wochenaufgaben als einzelne, wiederverwendbare Aufgaben.
roomsByDay && Object.keys(roomsByDay).forEach(()=>{});
roomsByDay && Object.keys(roomsByDay).forEach(day=>{(roomsByDay[day]||[]).forEach((room,ri)=>room[1].forEach((title,ai)=>addLibrary('room'+day+'-'+ri,room[0],title,7,'Wochenthema',ai)))});
daily.forEach((group,gi)=>group[1].forEach((title,ai)=>addLibrary('daily'+gi,group[0],title,1,'Alltag',ai)));
addLibrary('special','Wohnzimmer · EG','Regal(e) abstauben',28,'Individuelle Hauspflege',0);
addLibrary('special','Kinderzimmer 1 · OG','Kinderzimmer-Regal abstauben',28,'Individuelle Hauspflege',1);
addLibrary('special','Kinderzimmer 2 · OG','Kinderzimmer-Regal abstauben',28,'Individuelle Hauspflege',2);
addLibrary('special','special','Bücherregal ordnen und abstauben',28,'Individuelle Hauspflege',3);
addLibrary('special','Garderobe · EG','Garderobenflächen gründlich reinigen',14,'Individuelle Hauspflege',4);
addLibrary('windows','Fenster EG · Abschnitt 1','Fenster putzen inkl. Rahmen & Falze',180,'Fensterpflege',0);
addLibrary('windows','Fenster EG · Abschnitt 2','Fenster putzen inkl. Rahmen & Falze',180,'Fensterpflege',1);
addLibrary('windows','Fenster OG · Abschnitt 1','Fenster putzen inkl. Rahmen & Falze',180,'Fensterpflege',2);
addLibrary('windows','Fenster OG · Abschnitt 2','Fenster putzen inkl. Rahmen & Falze',180,'Fensterpflege',3);
state.customTasks.forEach(t=>taskLibrary.push(t));

function taskSearch(q){
 const needle=q.trim().toLowerCase();
 return taskLibrary.filter(t=>!needle || (t.title+' '+t.room+' '+t.category).toLowerCase().includes(needle));
}


function rotationDueIndex(){
 if(dayNumber()===7||dayNumber()===4)return null; // Sonntag frei, Donnerstag bewusst klein halten
 const eligible=[];
 rotations.forEach((r,i)=>{
   const last=state.lastDone['rot'+i];
   let due=false;
   if(last) due=daysSince(last)>=r[1];
   else if(state.rotationStart){const offset=(i*3)%Math.max(7,r[1]);due=daysSince(state.rotationStart)>=offset}
   if(due)eligible.push(i);
 });
 if(!eligible.length)return null;
 eligible.sort((a,b)=>{
   const la=state.lastDone['rot'+a]||state.rotationStart||'1900-01-01';
   const lb=state.lastDone['rot'+b]||state.rotationStart||'1900-01-01';
   return parseDate(la)-parseDate(lb)||a-b;
 });
 return eligible[0];
}
function ensureRotationStart(){if(!state.rotationStart)state.rotationStart=today()}
ensureRotationStart();

function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function taskCard(id,title,rotationIndex,canonical){
 const done=isDone(id), skipped=isSkipped(id);
 return `<div class="task ${done?'done ':''}${rotationIndex!==undefined?'rotationTask':''}" data-id="${escapeHtml(id)}" data-canonical="${escapeHtml(canonical||id)}" data-rotation="${rotationIndex===undefined?'':rotationIndex}"><div class="under right">ERLEDIGT ✓</div><div class="under left">SPÄTER</div><div class="body"><span class="dot"></span><div style="flex:1"><div class="title">${escapeHtml(title)}</div></div><span class="badge">${done?'✓':rotationIndex!==undefined?'Hauspflege':''}</span></div></div>`;
}
function roomCard(scope,room,actions,interval=7){
 const entries=actions.map((title,i)=>{const cid=canonicalId(scope,i),id=dayTaskId(scope,i);return {id,cid,title}}).filter(x=>!isSkipped(x.id)&&(interval===1||isDone(x.id)||dueByInterval(x.cid,interval)));
 if(!entries.length)return '';
 const n=entries.filter(x=>isDone(x.id)).length;
 return `<div class="room"><div class="roomhead"><div class="roomtitle">${escapeHtml(room)}</div><div class="count">${n}/${entries.length}</div></div>${entries.map(x=>taskCard(x.id,x.title,undefined,x.cid)).join('')}</div>`;
}
function dailyCard(groupIndex,group){return roomCard('daily'+groupIndex,group[0],group[1],1)}
function scheduledRoomCard(day,ri,room){return roomCard('room'+day+'-'+ri,room[0],room[1],7)}

function taskTitleForCanonical(canonical){
 const t=taskLibrary.find(x=>x.id===canonical);
 if(t)return t.title;
 if(canonical&&canonical.startsWith('rot')){
   const i=Number(canonical.slice(3));
   if(rotations[i])return rotations[i][0];
 }
 return canonical||'Aufgabe';
}
function doneEntriesForDate(date){
 const prefix=date+'|';
 const entries=[];
 Object.keys(state.done||{}).forEach(key=>{
   if(!key.startsWith(prefix)||!state.done[key])return;
   const canonical=key.slice(prefix.length);
   let title=taskTitleForCanonical(canonical);
   if(canonical.startsWith('extra|')){
     const idx=Number(canonical.slice(6));
     const ids=state.extras[date]||[];
     const t=taskLibrary.find(x=>x.id===ids[idx]);
     if(t)title=t.title;
   }
   entries.push({canonical,title});
 });
 return entries;
}
function formatHistoryDate(date){
 return new Intl.DateTimeFormat('de-AT',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(parseDate(date));
}
function monthLabel(d){return new Intl.DateTimeFormat('de-AT',{month:'long',year:'numeric'}).format(d).replace(/^./,c=>c.toUpperCase())}
function renderCalendar(){
 const el=document.getElementById('calendar');
 const y=calendarCursor.getFullYear(),m=calendarCursor.getMonth();
 const first=new Date(y,m,1),daysInMonth=new Date(y,m+1,0).getDate();
 const mondayOffset=(first.getDay()+6)%7;
 let cells='';
 const weekdays=['Mo','Di','Mi','Do','Fr','Sa','So'];
 weekdays.forEach(x=>cells+=`<div class="weekday">${x}</div>`);
 for(let i=0;i<mondayOffset;i++)cells+='<div></div>';
 for(let day=1;day<=daysInMonth;day++){
   const date=localDate(new Date(y,m,day));
   const count=doneEntriesForDate(date).length;
   const cls=(date===today()?' today':'')+(date===calendarSelected?' selected':'');
   cells+=`<button class="calDay${cls}" data-calendar-date="${date}"><span class="calNum">${day}</span><span class="calCount">${count?count+' ✓':''}</span></button>`;
 }
 let history='';
 const selectedEntries=doneEntriesForDate(calendarSelected);
 history+=`<div class="historyDay selected"><div class="historyDayHead"><strong>${escapeHtml(formatHistoryDate(calendarSelected))}</strong><span class="historyCount">${selectedEntries.length} erledigt</span></div>${selectedEntries.length?'<ul class="historyList">'+selectedEntries.map(x=>`<li>${escapeHtml(x.title)}</li>`).join('')+'</ul>':'<div class="historyEmpty">An diesem Tag ist noch nichts als erledigt gespeichert.</div>'}</div>`;
 history+='<div class="sectionhead"><h2>Letzte Tage</h2><span class="notice">tatsächlich erledigt</span></div>';
 for(let i=0;i<14;i++){
   const d=new Date();d.setDate(d.getDate()-i);const date=localDate(d);const entries=doneEntriesForDate(date);
   if(!entries.length)continue;
   history+=`<div class="historyDay"><div class="historyDayHead"><strong>${escapeHtml(formatHistoryDate(date))}</strong><span class="historyCount">${entries.length} erledigt</span></div><ul class="historyList">${entries.map(x=>`<li>${escapeHtml(x.title)}</li>`).join('')}</ul></div>`;
 }
 el.innerHTML=`<h2>📅 Verlauf</h2><div class="hint calendarHint"><strong>Hier siehst du, was du wirklich geschafft hast. ❤️</strong><br>Die Einträge stammen aus deinen tatsächlichen Erledigungen – nicht aus dem ursprünglichen Plan.</div><div class="calendarHead"><div class="calendarNav"><button id="calPrev">‹</button></div><div class="monthTitle">${escapeHtml(monthLabel(calendarCursor))}</div><div class="calendarNav"><button id="calNext">›</button></div></div><div class="calendarGrid">${cells}</div>${history}`;
 document.querySelectorAll('[data-calendar-date]').forEach(b=>b.onclick=()=>{calendarSelected=b.dataset.calendarDate;const d=parseDate(calendarSelected);calendarCursor=new Date(d.getFullYear(),d.getMonth(),1);renderCalendar()});
 document.getElementById('calPrev').onclick=()=>{calendarCursor=new Date(y,m-1,1);renderCalendar()};
 document.getElementById('calNext').onclick=()=>{calendarCursor=new Date(y,m+1,1);renderCalendar()};
}

function renderToday(){
 ensureRotationStart();
 const d=dayNumber(),special=roomsByDay[d]||[];
 const extraIds=state.extras[today()]||[];
 if(state.chaos){
   let out=`<div class="hint"><strong>Heute darf klein sein. 🧸</strong><br>Nur das, was für Alltag, Hanni und ein funktionierendes Zuhause wirklich nötig ist. Keine Wochenaufgaben, keine Spezialaufgabe, keine Rotation und kein Nachholen.</div>`;
   out+=`<div class="chaos"><h3>🧸 Hanni-Chaosmodus</h3><ul>${chaosEssentials[0][1].map(a=>`<li>${escapeHtml(a)}</li>`).join('')}</ul></div>`;
   out+=`<div class="notice">Wenn du mehr schaffst: schön. Wenn nicht: genau dafür ist dieser Modus da. ❤️</div>`;
   if(extraIds.length){out+='<h2 style="margin:20px 2px 9px">Heute zusätzlich</h2>';extraIds.forEach(cid=>{const t=taskLibrary.find(x=>x.id===cid);if(t&&!isSkipped(dayTaskId('extra',extraIds.indexOf(cid)))){const id=dayTaskId('extra',extraIds.indexOf(cid));out+=`<div class="room"><div class="roomhead"><div><div class="roomtitle">${escapeHtml(t.room)}</div><div class="sub">Individuell für heute</div></div><div class="count">${isDone(id)?'✓':'1 Aufgabe'}</div></div>${taskCard(id,t.title,undefined,t.id)}</div>`}})}
 out+=`<div class="addbar"><button id="addTask">＋ Einzelne Aufgabe hinzufügen</button></div>`;
   document.getElementById('today').innerHTML=out;bindSwipes();bindAdd();return;
 }
 let taskEls=[];
 daily.forEach((g,ri)=>g[1].forEach((a,i)=>{if(dueByInterval(canonicalId('daily'+ri,i),1)&&!isSkipped(dayTaskId('daily'+ri,i)))taskEls.push(dayTaskId('daily'+ri,i))}));
 special.forEach((g,ri)=>g[1].forEach((a,i)=>{if(dueByInterval(canonicalId('room'+d+'-'+ri,i),7)&&!isSkipped(dayTaskId('room'+d+'-'+ri,i)))taskEls.push(dayTaskId('room'+d+'-'+ri,i))}));
 const completedRotToday=rotations.findIndex((r,i)=>state.lastDone['rot'+i]===today());
 const rotIndex=completedRotToday>=0?completedRotToday:rotationDueIndex();
 if(rotIndex!==null)taskEls.push(dayTaskId('rotation'+rotIndex,0));
 extraIds.forEach((cid,ei)=>{const id=dayTaskId('extra',ei);if(!isSkipped(id))taskEls.push(id)});
 const doneCount=taskEls.filter(isDone).length,total=taskEls.length;
 let out=`<div class="hint">👉 <strong>Rechts wischen = erledigt.</strong> 👈 <strong>Links = später.</strong><br>Die App merkt sich für jede einzelne Aufgabe, wann du sie wirklich erledigt hast. Spontan vorgezogen = neuer Startpunkt für den nächsten Turnus.</div>`;
 out+=`<div class="grid"><div class="stat"><div class="num">${doneCount}/${total}</div><div class="label">Einzel-To-dos erledigt</div></div><div class="stat"><div class="num">${total}</div><div class="label">Heute vorgesehen</div></div></div>`;
 out+=`<div class="sectionhead"><h2>Heute</h2><button class="smallbtn" id="reset">Zurücksetzen</button></div><div class="progress"><i style="width:${total?doneCount/total*100:0}%"></i></div>`;
 out+='<h2 style="margin:20px 2px 9px">Alltag</h2>';
 daily.forEach((g,ri)=>out+=dailyCard(ri,g));
 if(special.length){out+='<h2 style="margin:20px 2px 9px">Wochenthema</h2>';special.forEach((g,ri)=>out+=scheduledRoomCard(d,ri,g));}
 if(rotIndex!==null){const r=rotations[rotIndex],rid=dayTaskId('rotation'+rotIndex,0);out+='<h2 style="margin:20px 2px 9px">Kleine Hauspflege</h2>';out+=`<div class="room rotationDue"><div class="roomhead"><div><div class="roomtitle">${escapeHtml(r[0])}</div><div class="sub">📍 ${escapeHtml(r[2])} · nur eine kleine Rotation heute</div></div><div class="count">${isDone(rid)?'✓':'1 Aufgabe'}</div></div>${taskCard(rid,'Pflegeaufgabe erledigen',rotIndex,'rot'+rotIndex)}</div>`;}
 out+=`<div class="addbar"><button id="addTask">＋ Einzelne Aufgabe hinzufügen</button></div>`;
 out+=`<div class="notice">Sonntag bleibt haushaltsfrei. Große Arbeiten, Technik und schwierige Höhenarbeiten dürfen ausgelagert werden.</div>`;
 document.getElementById('today').innerHTML=out;bindSwipes();bindAdd();
 const reset=document.getElementById('reset');if(reset)reset.onclick=resetToday;
}
function resetToday(){Object.keys(state.done).filter(k=>k.startsWith(today()+'|')).forEach(k=>delete state.done[k]);Object.keys(state.skipped).filter(k=>k.startsWith(today()+'|')).forEach(k=>delete state.skipped[k]);save()}
function renderWeek(){
 const names=['','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
 let out='<h2>Diese Woche</h2><div class="hint">Die Wochentage sind <strong>Anker, keine Pflicht.</strong> Wenn etwas nicht klappt, wird es nicht einfach auf den nächsten Tag gestapelt.</div>';
 for(let d=1;d<=7;d++){
   if(d===7){out+='<div class="day"><strong>Sonntag 🌿</strong><div class="sub">Haushaltsfrei – nur Alltag & wirklich Notwendiges.</div></div>';continue}
   const rooms=(roomsByDay[d]||[]).map(x=>'<li>'+escapeHtml(x[0])+'</li>').join('');
   out+=`<div class="day"><strong>${names[d]}</strong><ul>${rooms||'<li>nur Alltag</li>'}</ul>${d===4?'<small>Bewusst klein: kein Badezimmer-Deep-Clean und keine zusätzliche Rotation.</small>':''}${d===2?'<small>Badetag: gründlich, aber keine zusätzlichen Hauspflege-Aufgaben.</small>':''}</div>`;
 }
 document.getElementById('week').innerHTML=out;
}
function renderRotation(){
 let out='<h2>Hauspflege-Rotation</h2><div class="hint">Die Rotation läuft im Hintergrund. Sobald eine Aufgabe fällig ist, kann <strong>maximal eine kleine Rotation</strong> automatisch bei „Heute“ auftauchen. Maßgeblich ist das echte Erledigungsdatum – nicht ein verpasster Plan-Tag.</div>';
 rotations.forEach((r,i)=>{const last=state.lastDone['rot'+i];const due=last?daysSince(last)>=r[1]:false;const left=last?Math.max(0,r[1]-daysSince(last)):null;out+=`<div class="day ${due?'rotationDue':''}"><strong>${escapeHtml(r[0])}</strong><div class="sub">📍 ${escapeHtml(r[2])}</div><small>${last?due?'Jetzt fällig':`in ${left} Tagen`:'wird nach und nach eingeplant'}</small></div>`});
 document.getElementById('rotation').innerHTML=out;
}
function bindSwipes(){
 document.querySelectorAll('.task').forEach(el=>{
   let sx=0,dx=0,active=false;
   const body=el.querySelector('.body'),right=el.querySelector('.right'),left=el.querySelector('.left');
   el.addEventListener('pointerdown',e=>{sx=e.clientX;dx=0;active=true;try{el.setPointerCapture(e.pointerId)}catch(_){} });
   el.addEventListener('pointermove',e=>{if(!active)return;dx=e.clientX-sx;if(Math.abs(dx)>8){body.style.transform=`translateX(${dx}px)`;const a=Math.min(Math.abs(dx)/100,1);right.style.opacity=dx>0?a:0;left.style.opacity=dx<0?a:0}});
   const end=()=>{if(!active)return;active=false;if(Math.abs(dx)>85){const id=el.dataset.id;const canonical=el.dataset.canonical;const ri=el.dataset.rotation?Number(el.dataset.rotation):undefined;if(dx>0)markDone(id,ri,el.dataset.canonical);else skip(id)}else{body.style.transform='';right.style.opacity=0;left.style.opacity=0}};
   el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 });
}
function openAddTask(){
 const old=document.getElementById('taskModal');if(old)old.remove();
 const modal=document.createElement('div');modal.className='modal';modal.id='taskModal';
 modal.innerHTML=`<div class="sheet"><div class="sheettop"><h3>Aufgabe für heute</h3><button class="close" id="closeAdd">Schließen</button></div><div class="hint">Suche nach einem Wort wie <strong>Regal</strong>, <strong>Tür</strong> oder <strong>Spiegel</strong>. Die komplette Aufgabenbibliothek steht dir offen.</div><input class="search" id="taskSearch" placeholder="🔎 Aufgabe suchen …" autocomplete="off"><div class="results" id="taskResults"></div></div>`;
 document.body.appendChild(modal);
 const input=modal.querySelector('#taskSearch');const results=modal.querySelector('#taskResults');
 function paint(){
  const found=taskSearch(input.value).slice(0,30);
  results.innerHTML=found.length?found.map(t=>{const added=(state.extras[today()]||[]).includes(t.id);const scheduledToday=document.querySelector(`[data-canonical="${CSS.escape(t.id)}"]`);const last=lastFor(t.id);const age=last?daysSince(last):null;let meta=`📍 ${escapeHtml(t.room)} · ${escapeHtml(t.category)}`;if(age!==null)meta+=`<br>Zuletzt erledigt: vor ${age} ${age===1?'Tag':'Tagen'}`;else meta+='<br>Noch nie erledigt';return `<div class="result"><div class="resultmain"><div class="resulttitle">${escapeHtml(t.title)}</div><div class="resultmeta">${meta}</div>${age!==null&&age<t.interval?`<div class="dueTag">Eigentlich erst in ${t.interval-age} ${t.interval-age===1?'Tag':'Tagen'} wieder fällig – du kannst sie trotzdem vorziehen.</div>`:''}</div><button ${added||scheduledToday?'disabled':''} data-add="${escapeHtml(t.id)}">${added||scheduledToday?'✓ Heute drin':'＋ Heute'}</button></div>`}).join(''):'<div class="empty">Keine passende Aufgabe gefunden.</div>';
  results.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const t=taskLibrary.find(x=>x.id===b.dataset.add);if(!t)return;rememberExtra(t.id);save();openAddTask()});
 }
 input.addEventListener('input',paint);modal.querySelector('#closeAdd').onclick=()=>modal.remove();modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
 modal.addEventListener('click',e=>{if(e.target.id==='createCustom')openCustomTask(input.value)});
 paint();input.focus();
}
function openCustomTask(prefill=''){
 const old=document.getElementById('taskModal');if(old)old.remove();
 const modal=document.createElement('div');modal.className='modal';modal.id='taskModal';
 modal.innerHTML=`<div class="sheet"><div class="sheettop"><h3>Neue eigene Aufgabe</h3><button class="close" id="closeCustom">Schließen</button></div><div class="hint">Die Aufgabe wird dauerhaft in deiner persönlichen Bibliothek gespeichert. Du entscheidest, ob sie einmalig oder regelmäßig wiederkommen soll.</div><label class="fieldlabel">Aufgabe</label><input class="search" id="customTitle" value="${escapeHtml(prefill)}" placeholder="z. B. Küchenschränke innen auswischen"><label class="fieldlabel">Raum / Ort</label><input class="search" id="customRoom" placeholder="z. B. Küche · EG"><label class="fieldlabel">Wiederholung</label><select class="search" id="customInterval"><option value="0">Einmalig</option><option value="7">Wöchentlich</option><option value="14">Alle 2 Wochen</option><option value="30">Monatlich</option><option value="90">Alle 3 Monate</option><option value="180">Alle 6 Monate</option><option value="365">Jährlich</option></select><button class="primaryBtn" id="saveCustom">＋ Speichern & heute hinzufügen</button></div>`;
 document.body.appendChild(modal);
 modal.querySelector('#closeCustom').onclick=()=>modal.remove();
 modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
 modal.querySelector('#saveCustom').onclick=()=>{const title=modal.querySelector('#customTitle').value.trim();const room=modal.querySelector('#customRoom').value.trim();const interval=Number(modal.querySelector('#customInterval').value);if(!title){modal.querySelector('#customTitle').focus();return}const t=addCustomTask(title,room,interval);rememberExtra(t.id);save();modal.remove();};
 modal.querySelector('#customTitle').focus();
}
function bindAdd(){const b=document.getElementById('addTask');if(b)b.onclick=openAddTask}


const CHAT_ENDPOINT='https://hometasks.sandra-bojer.workers.dev/chat';
const CHAT_KEY='unserZuhauseChatV1';
let chatState;
try{chatState=JSON.parse(localStorage.getItem(CHAT_KEY)||'null')||{messages:[]}}catch(e){chatState={messages:[]}}
if(!Array.isArray(chatState.messages))chatState.messages=[];

function chatSave(){localStorage.setItem(CHAT_KEY,JSON.stringify({messages:chatState.messages.slice(-40)}))}
function chatContext(){
 const d=dayNumber(), rooms=roomsByDay[d]||[];
 const lines=[];
 lines.push('Datum: '+germanDate());
 lines.push('Hanni-Chaosmodus: '+(state.chaos?'AN':'AUS'));
 lines.push('Heute geplante Bereiche: '+(rooms.length?rooms.map(r=>r[0]).join(', '):'Sonntag – haushaltsfrei'));
 const todayItems=[];
 document.querySelectorAll('#today .task').forEach(el=>{
   const title=el.querySelector('.title')?.textContent?.trim();
   if(title) todayItems.push((el.classList.contains('done')?'✓ ':'• ')+title);
 });
 if(todayItems.length)lines.push('Heute sichtbare Einzelaufgaben:\n'+todayItems.slice(0,80).join('\n'));
 const recent=Object.entries(state.lastDone||{}).sort((a,b)=>b[1].localeCompare(a[1])).slice(0,20);
 if(recent.length)lines.push('Zuletzt tatsächlich erledigte Aufgaben (technische IDs):\n'+recent.map(x=>x[0]+' = '+x[1]).join('\n'));
 return lines.join('\n');
}
function renderChat(){
 const el=document.getElementById('chat');
 const msgs=chatState.messages;
 let out=`<div class="chatWrap"><div class="chatIntro"><strong>🤖 Mit mir sprechen</strong><span>Ich kenne den heutigen Plan und kann dir helfen, ihn realistisch an deinen Tag anzupassen. ❤️</span></div>`;
 out+=`<div class="chatExamples"><button class="chatExample" data-chat-example="Ich habe heute nur 20 Minuten.">Nur 20 Minuten</button><button class="chatExample" data-chat-example="Was ist heute wirklich wichtig?">Was ist wichtig?</button><button class="chatExample" data-chat-example="Ich habe gerade spontan etwas erledigt.">Etwas spontan erledigt</button></div>`;
 out+=`<div class="chatMessages" id="chatMessages">`;
 if(!msgs.length)out+=`<div class="chatMsg assistant">Hallo 🥰 Ich bin hier. Sag mir einfach, wie dein Tag gerade aussieht – auch wenn alles anders läuft als geplant.</div>`;
 msgs.forEach(m=>out+=`<div class="chatMsg ${m.role==='user'?'user':'assistant'}">${escapeHtml(m.content)}</div>`);
 out+=`</div><div class="chatStatus" id="chatStatus">Deine Chat-Historie bleibt auf diesem Gerät gespeichert.</div><div class="chatComposer"><textarea class="chatInput" id="chatInput" rows="1" placeholder="Schreib mir …"></textarea><button class="chatSend" id="chatSend">Senden</button></div></div>`;
 el.innerHTML=out;
 const input=document.getElementById('chatInput'),send=document.getElementById('chatSend');
 document.querySelectorAll('.chatExample').forEach(b=>b.onclick=()=>{input.value=b.dataset.chatExample;input.focus()});
 input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});
 send.onclick=sendChat;
 const box=document.getElementById('chatMessages');box.scrollTop=box.scrollHeight;
}
async function sendChat(){
 const input=document.getElementById('chatInput'),send=document.getElementById('chatSend'),status=document.getElementById('chatStatus');
 const text=input.value.trim();if(!text||send.disabled)return;
 chatState.messages.push({role:'user',content:text});chatSave();renderChat();
 const freshInput=document.getElementById('chatInput'),freshSend=document.getElementById('chatSend'),freshStatus=document.getElementById('chatStatus');
 freshSend.disabled=true;freshInput.disabled=true;freshStatus.textContent='Ich denke kurz nach … 🥰';
 try{
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(),30000);
   let response;
   try{
     response=await fetch(CHAT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chatState.messages.slice(-20),context:chatContext()}),signal:controller.signal});
   }finally{clearTimeout(timeout)}
   const data=await response.json().catch(()=>({}));
   if(!response.ok||!data.reply){
     const serverDetail=data.details?` ${data.details}`:'';
     throw new Error((data.error||`HTTP ${response.status}: Keine Antwort`)+serverDetail);
   }
   chatState.messages.push({role:'assistant',content:data.reply});chatSave();renderChat();
 }catch(err){
   const detail=err?.name==='AbortError'?'Zeitüberschreitung nach 30 Sekunden':((err && err.message)?err.message:'Unbekannter Fehler');
   chatState.messages.push({role:'assistant',content:'Oh 😮‍💨 Der Chat konnte gerade nicht antworten. Technischer Hinweis: '+detail});
   chatSave();renderChat();
 }
}
function switchTab(tab){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['today','week','calendar','chat'].forEach(id=>document.getElementById(id).hidden=id!==tab)}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
document.getElementById('chaos').addEventListener('click',()=>{state.chaos=!state.chaos;save()});
function render(){document.getElementById('date').textContent=germanDate();renderToday();renderWeek();renderCalendar();renderChat();document.getElementById('chaos').textContent=state.chaos?'🧸 Chaosmodus AUS':'🧸 Hanni-Chaosmodus'}
render();
})();
</script>
