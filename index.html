:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:900px;margin:0 auto;padding:26px 18px 110px}
.brand{font-size:16px;color:var(--muted);margin:2px 4px 2px}

.subtitle{font-size:16px;color:var(--muted);margin-bottom:24px}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tab{border:1px solid var(--line);background:var(--card);padding:13px 20px;border-radius:22px;font-weight:700}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.hero{padding:20px}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{background:var(--accent2);padding:10px 15px;border-radius:22px;font-weight:700}
.progress{height:10px;background:#ece7e2;border-radius:99px;overflow:hidden;margin:18px 0}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:.25s}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line);background:#fff;padding:12px 16px;border-radius:20px;font-weight:700}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

.notice{padding:16px;border-radius:22px;background:var(--green);color:var(--greenInk);line-height:1.45;margin-top:16px}
.notice.yellow{background:var(--yellow);color:#6c5b2b}
.notice.red{background:var(--red);color:#75443d}
.sectionTitle{font-size:19px;font-weight:800;margin:24px 4px 12px}
.task{display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:13px 12px;margin:9px 0;background:#fff;touch-action:pan-y}
.task.done{opacity:.56}.swipeHint{font-size:10px;color:var(--muted);text-align:center;margin:-3px 0 10px}
.check{width:27px;height:27px;border-radius:50%;border:2px solid #cfc5bc;display:grid;place-items:center;flex:0 0 27px;background:#fff}
.task.done .check{background:var(--accent);border-color:var(--accent);color:#fff}
.taskMain{min-width:0;flex:1}
.taskName{font-weight:700;line-height:1.25;font-size:15px}
.meta{font-size:11px;color:var(--muted);margin-top:3px}
.taskButtons{display:flex;gap:6px;position:relative;z-index:2}
.iconBtn{border:0;background:var(--accent2);border-radius:14px;padding:8px 10px}
.small{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 12px}
.celebrate{background:var(--green);border:1px solid #d8e6da;color:var(--greenInk);font-size:19px;font-weight:800;padding:17px;border-radius:22px;margin-bottom:16px}
.weekgrid{display:grid;gap:10px}
.daycard{border:1px solid var(--line);border-radius:22px;padding:16px;background:#fff}
.daycard.today{outline:2px solid var(--accent)}
.daycard.free{background:var(--green)}
.dayname{font-weight:800}.daytheme{color:var(--muted);margin-top:4px}
.historygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal{aspect-ratio:1;border:1px solid var(--line);border-radius:14px;background:#fff;padding:6px;text-align:center;font-size:12px}
.cal.done{background:var(--green);color:var(--greenInk);border-color:#d8e6da;font-weight:800}
.cal.today{outline:2px solid var(--accent)}
.cal small{display:block;margin-top:3px}
.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:#fff;outline:none}
.search:focus{border-color:var(--accent)}
.result{padding:13px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.result:last-child{border-bottom:0}
.resultText{flex:1}
.detailOverlay{position:fixed;inset:0;background:rgba(25,20,16,.42);display:none;align-items:flex-end;justify-content:center;z-index:50}
.detailOverlay.open{display:flex}
.sheet{background:#fff;width:min(900px,100%);max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px 30px}
.sheetTop{display:flex;justify-content:space-between;gap:12px}
.sheet h2{margin:0;font-size:25px}
.detailBox{margin-top:15px;background:var(--bg);border-radius:20px;padding:16px}
.detailBox b{display:block;margin-bottom:5px}
.close{border:0;background:var(--accent2);border-radius:50%;width:42px;height:42px;font-size:22px}
input[type=text]{min-width:0}
.formrow{display:flex;gap:8px;margin-top:10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#2d2b29;color:#fff;padding:12px 17px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}

function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function dayKey(d=today){return iso(d)}
function dateLabel(d=today){return new Intl.DateTimeFormat("de-AT",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}).format(d)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove("show"),1800)}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}

 const x=new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()+4-(x.getDay()||7));
 const y=new Date(x.getFullYear(),0,1); return Math.ceil((((x-y)/86400000)+1)/7);
}
function weekA(d=today){return weekNumber(d)%2===0}

 const base=new Date(2026,8,4,12); const x=new Date(d); x.setHours(12,0,0,0);
 const diff=Math.round((x-base)/86400000);
 return BASEMENT[((Math.floor(diff/7)%3)+3)%3];
}
function themeFor(d){
 const dow=d.getDay();
 if(dow===0)return "Haushaltsfrei ❤️";
 if(dow===1)return "EG · Wohnen, Essen & Küche";
 if(dow===2)return weekA(d)?"Gäste-WC + Kinderbad":"Bad + WC";
 if(dow===3)return "OG · Schlaf- & Kinderbereiche";
 if(dow===4)return weekA(d)?"Eingang + Garderobe + Flur":"Büro + Abstellraum + Speis";
 if(dow===5)return "Keller · nur ein Raum · "+basementRoom(d);
 return "Wäsche + maximal eine Sonderaufgabe";
}
function roomTasks(room){
 const row=catalogSeed.find(r=>r[0]===room);
 if(!row)return [];
 return Array.isArray(row[2])?row[2]:Array.isArray(row[1])?row[1]:[];
}
function planForDate(d=today){
 const dow=d.getDay();
 if(dow===0)return [];
 if(dow===1)return [["Wohnzimmer",roomTasks("Wohnzimmer").slice(0,5)],["Essbereich",roomTasks("Essbereich").slice(0,4)],["Küche",roomTasks("Küche").slice(0,6)]];
 if(dow===2){
   const rooms=weekA(d)?BATH_A:BATH_B;
   return rooms.map(r=>[r,roomTasks(r).slice(0,5)]);
 }
 if(dow===3)return [["Schlafzimmer",roomTasks("Schlafzimmer").slice(0,5)],["Ankleidezimmer",roomTasks("Ankleidezimmer").slice(0,4)],["Kinderzimmer 1",roomTasks("Kinderzimmer 1").slice(0,4)],["Kinderzimmer 2",roomTasks("Kinderzimmer 2").slice(0,4)]];
 if(dow===4){
   const rooms=weekA(d)?["Eingangsbereich","Garderobe","Flur"]:["Büro","Abstellraum","Speis"];
   return rooms.map(r=>[r,roomTasks(r).slice(0,4)]);
 }
 if(dow===5){const r=basementRoom(d);return [[r,BASEMENT_TASKS[r]]]}
 return [["Waschküche",["Wäsche sammeln/sortieren","Waschmaschine nach Bedarf laufen lassen","Arbeitsfläche kurz reinigen","Boden bei Bedarf saugen"]]];
}

function dailyTasks(){

function plannedTasks(d=today){

 const out=dailyTasks();
 if(state.chaos)return out.filter(x=>["Geschirrspüler einräumen/einschalten","Küchenarbeitsfläche abwischen","Esstisch abwischen","Hochstuhl/Essplatz sauber machen","Heruntergefallenes Essen vom Boden entfernen","Müll kontrollieren"].includes(x.text));
 const plan=planForDate(d);
 for(const [room,tasks] of plan) for(const t of tasks) out.push({id:"plan|"+dayKey(d)+"|"+room+"|"+t,canonical:room+"|"+t,text:t,room,area:SEED_ROOMS[room]?.[1]||"",group:room});
 return out;
}
function isDone(task){return !!state.done[task.id]}
function toggleTask(task){
 state.done[task.id]=!state.done[task.id];
 if(state.done[task.id])state.lastDone[task.canonical]=dayKey();
 save(); render();
}
function postponeTask(task){
 state.postponed[uid()]={text:task.text,room:task.room,area:task.area,canonical:task.canonical,from:dayKey()};
 save(); render(); toast("Auf später verschoben ↩");
}
function restorePostponed(id){delete state.postponed[id];save();render();toast("Wieder geöffnet ❤️")}
function completedToday(){
 const tasks=plannedTasks();
 return tasks.length>0 && tasks.every(isDone);
}
function updateCompletion(){
 const k=dayKey();
 if(completedToday()) state.completedDays[k]=true;
 else delete state.completedDays[k];
 save();
}
function swipeRow(el,task){
 let sx=0,sy=0,active=false;
 const start=(x,y)=>{sx=x;sy=y;active=true};
 const end=(x,y)=>{
   if(!active)return; active=false;
   const dx=x-sx,dy=y-sy;
   if(Math.abs(dx)>=70 && Math.abs(dx)>Math.abs(dy)*1.15){
     if(dx>0){
       state.done[task.id]=true;
       state.lastDone[task.canonical]=dayKey();
       save(); render(); toast("Erledigt ✓");
     }else{
       postponeTask(task);
     }
   }
 };
 el.addEventListener("touchstart",e=>{
   if(e.touches.length===1) start(e.touches[0].clientX,e.touches[0].clientY);
 },{passive:true});
 el.addEventListener("touchend",e=>{
   if(e.changedTouches.length) end(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
 },{passive:true});
 // Also support trackpad/mouse dragging on devices where pointer events are available.
 el.addEventListener("pointerdown",e=>{
   if(e.pointerType==="mouse" || e.pointerType==="pen"){start(e.clientX,e.clientY);}
 });
 el.addEventListener("pointerup",e=>{
   if(e.pointerType==="mouse" || e.pointerType==="pen"){end(e.clientX,e.clientY);}
 });
}
function taskRow(task){

 <div class="taskButtons"><button class="iconBtn info" aria-label="Details">ⓘ</button><button class="iconBtn later" aria-label="Verschieben">↩</button></div>`;

 el.querySelector(".info").onclick=()=>openDetail(task.text,task.room,task.area);
 el.querySelector(".later").onclick=()=>postponeTask(task);
 swipeRow(el,task);

}

 function draw(){
  const q=input.value.trim().toLowerCase();
  const arr=allCatalog().filter(x=>!q || [x.text,x.room,x.area].join(" ").toLowerCase().includes(q));
  results.innerHTML=`<div class="small" style="padding:5px">${arr.length} Treffer</div>`;
  arr.slice(0,80).forEach(x=>{
   const row=document.createElement("div");row.className="result";
   row.innerHTML=`<div class="resultText"><b>${esc(x.text)}</b><div class="meta">${esc(x.room)} · ${esc(x.area)}</div></div><button class="iconBtn">ⓘ</button><button class="iconBtn">＋</button>`;
   row.children[1].onclick=()=>openDetail(x.text,x.room,x.area);
   row.children[2].onclick=()=>{const id="customcatalog|"+uid();state.custom.push({id,text:x.text,room:x.room,area:x.area});state.done[id]=false;save();toast("Heute hinzugefügt");};
   results.appendChild(row);
  });
  if(!arr.length)results.innerHTML+=`<div class="empty">Nichts gefunden. ❤️</div>`;
 }
 input.oninput=draw;draw();
 main.querySelector("#backToday").onclick=()=>{selectedTab="today";render()};
 input.focus();
}
function render(){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===selectedTab));
 if(selectedTab==="today")renderToday();
 else if(selectedTab==="week")renderWeek();
 else if(selectedTab==="history")renderHistory();
 else renderCatalog();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{selectedTab=b.dataset.tab;render()});
document.getElementById("closeDetail").onclick=()=>document.getElementById("detailOverlay").classList.remove("open");
document.getElementById("detailOverlay").onclick=e=>{if(e.target.id==="detailOverlay")e.currentTarget.classList.remove("open")};
render();
</script>
</body>
</html>
